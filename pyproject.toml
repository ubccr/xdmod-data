[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xdmod-data"
dynamic = ["version"]
dependencies = [
    "numpy >= 1.23.0",
    "pandas >= 1.5.0",
    "plotly >= 5.8.0",
    "requests >= 2.19.0",
]
requires-python = ">= 3.8"
authors = [
    {name = "Aaron Weeden"},
    {name = "Joseph P. White"},
    {name = "Rodney Garnett"}
]
maintainers = [
    {name = "Aaron Weeden"},
    {name = "Joseph P. White"}
]
description = "Python package for Open XDMoD data access"

[project.optional-dependencies]
report = ["IPython >= 6.5"]

[project.readme]
text = "See the [README](https://github.com/ubccr/xdmod-data?tab=readme-ov-file#xdmod-data) for instructions on use."
content-type = "text/markdown"

[project.urls]
"Source Code" = "https://github.com/ubccr/xdmod-data"

[tool.setuptools.dynamic]
version = {attr = "xdmod_data.__version__"}

[tool.setuptools]
license-files = ["LICENSE"]

[tool.coverage.report]
omit = ["tests/scripts/*"]
